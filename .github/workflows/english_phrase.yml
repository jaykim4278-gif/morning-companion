name: english-phrase

# 아침 영어회화 한 마디 발송.
#
# cron: UTC 09~14시 매 5분 (사용자 거주 도시 새벽 윈도우 매 5분 정시 발송 보장).
# schedule gate (user_preferences.english_phrase_time + last_english_sent_at) 가 중복 차단.
on:
  schedule:
    - cron: '*/5 9-14 * * *'
  workflow_dispatch:
    inputs:
      skip_gate:
        description: 'schedule gate 우회 (수동 검증)'
        required: false
        default: 'false'
        type: boolean
      theme:
        description: '테마 강제 (small_talk/soft_skills/reactions/idioms)'
        required: false
        default: ''
        type: string

jobs:
  english:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run english phrase (full mode, schedule-gated)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # 좁은 morning_companion_writer PostgreSQL role 로 발급된 JWT.
          MORNING_COMPANION_SUPABASE_JWT: ${{ secrets.MORNING_COMPANION_SUPABASE_JWT }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OWNER_USER_ID: ${{ secrets.OWNER_USER_ID }}
          USER_CITY: ${{ secrets.USER_CITY }}
          USER_CITY_KO: ${{ secrets.USER_CITY_KO }}
          USER_LAT: ${{ secrets.USER_LAT }}
          USER_LON: ${{ secrets.USER_LON }}
          USER_TZ: ${{ secrets.USER_TZ }}
          USER_NWS_ZONE_PREFIX: ${{ secrets.USER_NWS_ZONE_PREFIX }}
          USER_PERSONA_PROMPT: ${{ secrets.USER_PERSONA_PROMPT }}
          USER_INTERESTS: ${{ secrets.USER_INTERESTS }}
          TZ: ${{ secrets.USER_TZ }}
          ENGLISH_SKIP_GATE: ${{ inputs.skip_gate }}
        run: |
          ARGS="--mode full"
          if [ -n "${{ inputs.theme }}" ]; then
            ARGS="$ARGS --theme ${{ inputs.theme }}"
          fi
          PYTHONPATH=. python scripts/dry_run_english_phrase.py $ARGS
